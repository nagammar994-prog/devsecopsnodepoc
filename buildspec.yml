version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: devsecops-poc

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing tools"
      - pip3 install checkov
      - curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
      - curl -sL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.24.2_linux_x64.tar.gz || (echo "gitleaks download failed" && exit 1)
      - tar -xzf gitleaks.tar.gz
      - chmod +x gitleaks

  pre_build:
    commands:
      - echo "ECR Login"
      - aws ecr get-login-password | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - IMAGE_TAG=${CODEBUILD_BUILD_NUMBER}
      - IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}
      - npm install

  build:
    commands:
      - echo "Secrets Scan"
      - ./gitleaks detect --source . --exit-code 1 || true
      - echo "Dependency Scan"
      - npm audit --audit-level=high || true
      - echo "Docker Build"
      - docker build -t ${IMAGE_URI} ./app
      - echo "Trivy Scan"
      - ./bin/trivy image --exit-code 1 --severity HIGH,CRITICAL ${IMAGE_URI} || true
      - echo "Terraform Validation"
      - terraform -chdir=terraform init -backend=false || true
      - terraform -chdir=terraform validate || true
      - echo "Checkov"
      - checkov -d terraform || true
      - echo "tfsec"
      - tfsec terraform || true

  post_build:
    commands:
      - docker push ${IMAGE_URI} || true
      - echo "[{\"name\":\"devsecops-poc\",\"imageUri\":\"${IMAGE_URI}\"}]" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
