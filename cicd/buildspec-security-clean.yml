version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "devsecops-poc"

phases:
  install:
    runtime-versions:
      nodejs: 18

    commands:
      - echo "Installing tools"

      - TERRAFORM_VERSION=1.9.8

      - curl -Lo terraform.zip https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip

      - unzip -o terraform.zip

      - mv terraform /usr/local/bin/

      - terraform version

      - pip3 install checkov

      - GITLEAKS_VERSION=8.24.2

      - curl -Lo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz

      - tar -xzf gitleaks.tar.gz

      - chmod +x gitleaks
     
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"

      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com

      - IMAGE_TAG=${CODEBUILD_BUILD_NUMBER}

      - IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}

      - echo "IMAGE_URI=${IMAGE_URI}"

      - cd app

      - npm install

      - cd ..

  build:
    commands:
      - echo "Running Gitleaks"

      - ./gitleaks detect --no-git --source . --exit-code 1 || true

      - echo "Running npm audit"

      - cd app

      - npm audit --audit-level=high || true

      - cd ..

      - echo "Terraform Validation"

      - terraform -chdir=Terraform/dev init -backend=false

      - terraform -chdir=Terraform/dev validate

      - echo "Running Checkov"

      - checkov -d Terraform || true

      - echo "Building Docker Image"

      - docker build -t ${IMAGE_URI} ./app

      - echo "Listing Docker Images"

      - docker images

  post_build:
    commands:
      - echo "Pushing Docker Image"

      - docker push ${IMAGE_URI}

      - printf '[{"name":"devsecops-app","imageUri":"%s"}]' ${IMAGE_URI} > imagedefinitions.json

  finally:
    commands:
      - ls -ltr
      - cat imagedefinitions.json || true

artifacts:
  files:
    - imagedefinitions.json