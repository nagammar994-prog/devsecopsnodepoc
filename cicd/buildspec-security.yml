version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: devsecops-poc

phases:

  install:
    runtime-versions:
      nodejs: 18

    commands:
      - echo "Installing security tools"

      # Checkov
      - pip3 install checkov

      # Terraform
      - curl -fsSL https://apt.releases.hashicorp.com/gpg | apt-key add -
      - apt-get update -y
      - apt-get install -y terraform

      # Trivy
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh

      # tfsec
      - curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      # Gitleaks
      - curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz -o gitleaks.tar.gz
      - tar -xzf gitleaks.tar.gz
      - chmod +x gitleaks

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"

      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com

      - IMAGE_TAG=${CODEBUILD_BUILD_NUMBER}

      - IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}

      - echo "Installing Node dependencies"
      - cd app
      - npm install
      - cd ..

  build:
    commands:

      - echo "Running Gitleaks"
      - ./gitleaks detect --source . --exit-code 1

      - echo "Running npm audit"
      - cd app
      - npm audit --audit-level=high
      - cd ..

      - echo "Building Docker image"
      - docker build -t ${IMAGE_URI} ./app

      - echo "Running Trivy scan"
      - ./bin/trivy image --exit-code 1 --severity HIGH,CRITICAL ${IMAGE_URI}

      - echo "Terraform Validation"
      - terraform -chdir=Terraform/dev init -backend=false

      - terraform -chdir=Terraform/dev validate

      - echo "Running Checkov"
      - checkov -d Terraform

      - echo "Running tfsec"
      - tfsec Terraform

  post_build:
    commands:

      - echo "Pushing Docker image"

      - docker push ${IMAGE_URI}

      - printf '[{"name":"devsecops-app","imageUri":"%s"}]' ${IMAGE_URI} > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json