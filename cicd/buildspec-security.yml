version: 0.2

env:
variables:
IMAGE_REPO_NAME: "devsecops-poc"
ARTIFACT_BUCKET: "devsecops-artifacts-dev"

phases:

install:
runtime-versions:
nodejs: 18

```
commands:
  - echo "Installing Security Tools"

  # Upgrade pip
  - python3 -m pip install --upgrade pip -q

  # Install Semgrep & Checkov
  - pip3 install -q semgrep checkov

  # Install Trivy
  - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh > /dev/null 2>&1

  # Install Gitleaks
  - GITLEAKS_VERSION=8.24.2
  - wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
  - tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
  - chmod +x gitleaks
  - mv gitleaks /usr/local/bin/

  # Minimal version verification
  - echo "Tool Versions:"
  - semgrep --version
  - checkov --version
  - ./bin/trivy --version
  - gitleaks version
```

pre_build:
commands:

```
  - echo "Preparing Build"

  - mkdir -p reports

  - export BUILD_ID=${CODEBUILD_BUILD_NUMBER}
  - export IMAGE_TAG=${CODEBUILD_BUILD_NUMBER}

  - export IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}

  - echo "Logging in to Amazon ECR"

  - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com

  - echo "IMAGE_URI=${IMAGE_URI}"
```

build:
commands:

```
  - echo "Running Security Scans"

  # Gitleaks
  - gitleaks detect --source . --no-git --report-format json --report-path reports/gitleaks.json || true

  # Semgrep
  - semgrep scan --config auto --quiet --json --output reports/semgrep.json || true

  # Checkov
  - checkov -d Terraform --quiet -o json --soft-fail > reports/checkov.json || true

  # Trivy Filesystem
  - ./bin/trivy fs . --scanners vuln --quiet --severity HIGH,CRITICAL --format json -o reports/trivy-fs.json

  # Docker Build
  - echo "Building Docker Image"
  - docker build -t ${IMAGE_URI} ./app

  # Trivy Image Scan
  - ./bin/trivy image ${IMAGE_URI} --scanners vuln --quiet --severity HIGH,CRITICAL --format json -o reports/trivy-image.json

  # Verify Reports
  - echo "Generated Reports"
  - ls -lh reports

  # Dashboard Generation
  - echo "Generating Dashboard"
  - python3 cicd/dashboard.py
```

post_build:
commands:

```
  - echo "Uploading Reports"

  - aws s3 cp reports/ s3://${ARTIFACT_BUCKET}/security-dashboard/build-${BUILD_ID}/ --recursive

  - echo "Pushing Docker Image"

  - docker push ${IMAGE_URI}

  - echo "Creating ECS Artifact"

  - printf '[{"name":"devsecops-app","imageUri":"%s"}]' ${IMAGE_URI} > imagedefinitions.json

  - cat imagedefinitions.json
```

artifacts:
files:
- imagedefinitions.json
