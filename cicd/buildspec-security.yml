version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "devsecops-poc"
    ARTIFACT_BUCKET: "devsecops-artifacts-dev"

phases:
  install:
    runtime-versions:
      nodejs: 18

    commands:
      - echo "Installing Security Tools"

      - python3 -m pip install --upgrade pip
      - pip3 install semgrep checkov pandas jinja2

      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh

      - GITLEAKS_VERSION=8.24.2
      - wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
      - tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
      - chmod +x gitleaks
      - mv gitleaks /usr/local/bin/

  pre_build:
    commands:
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com

      - export IMAGE_TAG=${CODEBUILD_BUILD_NUMBER}
      - export BUILD_ID=${CODEBUILD_BUILD_NUMBER}

      - export IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}

      - mkdir -p reports

      - echo "IMAGE_URI=${IMAGE_URI}"

  build:
    commands:

      - echo "========== GITLEAKS =========="
      - gitleaks detect --source . --no-git || true

      - echo "========== SEMGREP =========="
      - semgrep scan --config auto . --json --output reports/semgrep.json || true

      - echo "========== CHECKOV =========="
      - checkov -d Terraform -o json --soft-fail > reports/checkov.json || true

      - echo "========== TRIVY FILESYSTEM SCAN =========="
      - ./bin/trivy fs . --severity HIGH,CRITICAL --format json -o reports/trivy-fs.json --exit-code 0

      - echo "========== DOCKER BUILD =========="
      - docker build -t ${IMAGE_URI} ./app

      - echo "========== TRIVY IMAGE SCAN =========="
      - ./bin/trivy image ${IMAGE_URI} --severity HIGH,CRITICAL --format json -o reports/trivy-image.json --exit-code 0

      - echo "========== VERIFY REPORTS =========="
      - ls -ltr reports

      - echo "========== GENERATE SECURITY DASHBOARD =========="
      - |
        cat > reports/security-dashboard.html <<EOF
        <html>
        <head>
          <title>DevSecOps Security Dashboard</title>
        </head>
        <body>
          <h1>DevSecOps Security Dashboard</h1>
          <p>Build Number: ${BUILD_ID}</p>
        </body>
        </html>
        EOF

  post_build:
    commands:

      - echo "========== UPLOAD SECURITY REPORTS =========="

      - test -f reports/semgrep.json && aws s3 cp reports/semgrep.json s3://${ARTIFACT_BUCKET}/security-dashboard/build-${BUILD_ID}/semgrep.json || true

      - test -f reports/checkov.json && aws s3 cp reports/checkov.json s3://${ARTIFACT_BUCKET}/security-dashboard/build-${BUILD_ID}/checkov.json || true

      - test -f reports/trivy-fs.json && aws s3 cp reports/trivy-fs.json s3://${ARTIFACT_BUCKET}/security-dashboard/build-${BUILD_ID}/trivy-fs.json || true

      - test -f reports/trivy-image.json && aws s3 cp reports/trivy-image.json s3://${ARTIFACT_BUCKET}/security-dashboard/build-${BUILD_ID}/trivy-image.json || true

      - test -f reports/security-dashboard.html && aws s3 cp reports/security-dashboard.html s3://${ARTIFACT_BUCKET}/security-dashboard/build-${BUILD_ID}/security-dashboard.html || true

      - echo "========== PUSH IMAGE =========="
      - docker push ${IMAGE_URI}

      - echo "========== CREATE IMAGEDEFINITIONS =========="
      - printf '[{"name":"devsecops-app","imageUri":"%s"}]' ${IMAGE_URI} > imagedefinitions.json

      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
